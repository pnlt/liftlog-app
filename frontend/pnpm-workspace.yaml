packages:
  - apps/*
  - packages/*

# React Native libraries still assume a flat node_modules. See ../docs/adr/0001-monorepo-layout.md.
nodeLinker: hoisted

# Postinstall scripts are opt-in. None of these are needed: esbuild and unrs-resolver
# ship prebuilt binaries as optional deps, the rest only print banners.
allowBuilds:
  browser-tabs-lock: false
  core-js: false
  esbuild: false
  unrs-resolver: false

patchedDependencies:
  react-native-filament@1.11.0: patches/react-native-filament@1.11.0.patch
